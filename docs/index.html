<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看板コレクション - Kanban Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">看板コレクション</h1>
            <p class="subtitle">Signage Collection by PiiJey</p>
        </div>
    </header>

    <main class="container">
        <!-- 検索・フィルタエリア -->
        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="テキストで検索..."
                >
            </div>

            <div class="search-box">
                <input 
                    type="text" 
                    id="pictogramInput" 
                    class="search-input" 
                    placeholder="ピクトグラムで検索..."
                >
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>言語:</label>
                    <select id="languageSelect" class="filter-select">
                        <option value="">全て</option>
                    </select>
                </div>
                
                <!--
                <div class="filter-group">
                    <label>形態:</label>
                    <select id="formSelect" class="filter-select">
                        <option value="">全て</option>
                    </select>
                </div>
                -->
            </div>

            <div class="result-info">
                <span id="resultCount">0</span> 件
            </div>
        </div>

        <!-- グリッド表示 -->
        <div class="grid" id="gallery"></div>
    </main>

    <!-- モーダル -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="modal-body">
                <img id="modalImage" class="modal-image" src="" alt="">
                <div class="modal-info">
                    <div id="signsList" class="signs-list"></div>
                    <div class="modal-meta" id="imageMeta"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <a href="https://github.com/piijey/kanban" target="_blank" rel="noopener">ソースコード (GitHub)</a>
            <p class="footer-note">© PiiJey, <a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener">CC BY 4.0</a></p>
            <p class="footer-note">地名情報（国・都道府県・市区町村）は <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a> のデータを使用しています</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
